# Alembic Configuration

[alembic]
# path to migration scripts
sqlalchemy.url = 
script_location = migrations

# template_location = 

# sys_path = 

# timezone to use when rendering the timezone info
# into the migration file as well as when executing migration
# code on the database server.  Leave this off
# to disable timezone execution (and rely on dedicated columns).
# Or leave it as UTC(+0:00).
#
# timezone =

# max length of characters to apply to the
# "slug" field in the migration_history table.  The default
# value is 40 chars; set to lower value if rending an object name
# (sql server compat.)- length as sql treats the name as case-
# insensitive.  a greater value such as 60 may be appropriate
# for use cases which don't use names generated by add_table().
#
# truncate_slug_len = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
